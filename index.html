<script>
const $ = s => document.querySelector(s)
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]))
function stars(r){
  if(r==null) return ""
  const n=Math.round(r)
  return "★".repeat(n)+"☆".repeat(5-n)
}
function money(n,label){
  if(n==null) return {html: esc(label||"Ver precio"), hidden:true}
  const [d,c]=n.toFixed(2).split(".")
  return {html:`US$${esc(d)}<small>${esc(c)}</small>`, hidden:false}
}
function eta(s){
  if(!s) return ""
  let t=s.replace(/^FREE delivery\s*/i,"Entrega GRATIS ")
         .replace(/^Get it\s*/i,"Recíbelo ")
         .replace(/\bTomorrow\b/i,"mañana")
         .replace(/\bWed\b/,"mié").replace(/\bThu\b/,"jue").replace(/\bFri\b/,"vie")
         .replace(/\bMon\b/,"lun").replace(/\bTue\b/,"mar").replace(/\bSat\b/,"sáb").replace(/\bSun\b/,"dom")
         .replace(/\bAug\b/,"ago").replace(/\bSep\b/,"sep")
  return t
}
function card(it){
  const p=money(it.price, it.mapHidden?"Ver precio":it.priceLabel)
  const reviews=it.reviewCount!=null?` <span class="n">(${Number(it.reviewCount).toLocaleString("es")})</span>`:""
  return `<article class="card">
    <div class="media">
      ${it.badge?`<span class="pick">${esc(it.badge)}</span>`:""}
      <img src="${esc(it.image||"")}" alt=""/>
      <button class="heart" type="button" aria-label="Guardar">♡</button>
    </div>
    <div class="info">
      ${it.sponsored?`<div class="spon">Patrocinado</div>`:""}
      <div class="title">${esc(it.title||"")}</div>
      ${it.extra?`<div class="extra">${esc(it.extra)}</div>`:""}
      <div class="rating"><span class="stars">${it.rating??""} ${stars(it.rating)}</span>${reviews}</div>
      ${it.boughtPastMonth?`<div class="bought">${esc(it.boughtPastMonth)} comprados el mes pasado</div>`:""}
      ${it.brand?`<div class="brand">${esc(it.brand)}</div>`:""}
      <div class="price ${p.hidden?"hidden":""}">${p.html}</div>
      ${it.prime?`<div class="prime">prime</div>`:""}
      ${it.delivery?`<div class="eta">${esc(eta(it.delivery))}</div>`:""}
      <a class="cart" href="${esc(it.url)}" target="_blank" rel="noopener">Agregar al carrito</a>
    </div>
  </article>`
}
function skeleton(){

    <div class="info"><div class="bone t1"></div><div class="bone t2"></div><div class="bone t3"></div><div class="bone t4"></div><div class="bone t5"></div></div>
  </article>`
  $("#list").innerHTML = bone.repeat(5)
}
function render(data, extra){
  const results=data.results||[]
  $("#list").innerHTML=results.map(card).join("")
  $("#status").textContent = extra || (`${results.length} resultados de “${data.query||"Play 5"}” · scrape Firecrawl, sin key en esta página.`)
}
function loadSeed(){
  try{ return JSON.parse($("#seed").textContent) }catch(e){ return {results:[]} }
}
$("#f").addEventListener("submit", async ev=>{
  ev.preventDefault()
  const q=$("#q").value.trim()
  if(!q) return
  $("#status").textContent="Buscando “"+q+"”…"
  skeleton()
  try{
    const r=await fetch("/api/search?q="+encodeURIComponent(q),{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({q})})
    const data=await r.json().catch(()=>({}))
    if(!r.ok || data.error) throw new Error(data.error || ("HTTP "+r.status))
    if(!data.results || !data.results.length) throw new Error("sin resultados")
    render(data, "Búsqueda en vivo · “"+q+"” · "+data.results.length+" resultados")
  }catch(e){
    render(loadSeed(), "No se pudo buscar “"+q+"”: "+(e.message||e))
  }
})
render(loadSeed())
</script>
</body>
</html>
